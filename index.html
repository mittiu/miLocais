<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GTA Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#0e0f12;color:#fff}
#map{width:100%;height:100vh;background-color: #133e69f2;}

.context-menu{
  position:absolute;
  background:#161a22;
  border:1px solid #2b2f3a;
  border-radius:10px;
  padding:8px 12px;
  cursor:pointer;
  z-index:1000;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

.hidden{display:none}

.card{
  width:380px;
  background:#12141a;
  border:1px solid #2b2f3a;
  border-radius:14px;
  padding:14px;
}

input,select{
  width:100%;
  padding:8px;
  margin:6px 0;
  background:#0e1016;
  border:1px solid #2b2f3a;
  color:#fff;
  border-radius:8px;
}

button{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #2b2f3a;
  background:#2a5cff;
  color:#fff;
  cursor:pointer;
}

.icon-option{
  display:flex;
  align-items:center;
  gap:6px;
}

/* ===== Popup Moderno (Leaflet) ===== */
.leaflet-popup-content-wrapper{
  background:#12141a !important;
  color:#fff !important;
  border:1px solid #2b2f3a !important;
  border-radius:14px !important;
  box-shadow:0 14px 40px rgba(0,0,0,.55) !important;
}

.leaflet-popup-content{
  margin:12px 12px !important;
  min-width:220px;
  font-size:13px;
  line-height:1.25rem;
}

.leaflet-popup-tip{
  background:#12141a !important;
  border:1px solid #2b2f3a !important;
}

.leaflet-container a.leaflet-popup-close-button{
  color:#fff !important;
  opacity:.75;
  margin-top:2px;
}
.leaflet-container a.leaflet-popup-close-button:hover{
  opacity:1;
}

/* Conteúdo do popup */
.p-title{
  font-weight:800;
  font-size:14px;
  margin-bottom:4px;
}
.p-desc{
  opacity:.85;
  margin-bottom:8px;
}
.p-img{
  width:100%;
  max-width:280px;
  border-radius:12px;
  border:1px solid #232634;
  display:block;
  margin-top:8px;
  cursor:pointer;
}
.img-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:5000;
  padding:16px;

  /* 🔒 por padrão fica desligado */
  display:none;
  align-items:center;
  justify-content:center;
}

/* quando abrir */
.img-modal.show{
  display:flex;
}

.img-wrap{
  position:relative;
  width:min(1100px, 96vw);
  height:min(90vh, 900px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.img-full{
  max-width:100%;
  max-height:100%;
  border-radius:14px;
  box-shadow:0 18px 60px rgba(0,0,0,.6);
}

.img-close{
  position:absolute;
  top:-10px;
  right:-10px;
  width:36px;
  height:36px;
  border-radius:50%;
  border:none;
  background:#ff3b3b;
  color:#fff;
  font-weight:900;
  cursor:pointer;
}
</style>
</head>
<body>
<div style="position:absolute;left:0;top:0;height:100%;width:200px;background:#111;z-index:500;overflow:auto;">
  <div style="padding:10px;font-weight:bold;border-bottom:1px solid #222;">
    📍 Blips
  </div>
  <div id="sidebarList"></div>
</div>

<div id="map" style="margin-left:200px;"></div>

<!-- MENU DIREITO -->
<div id="contextMenu" class="context-menu hidden">
  ➕ Adicionar CDS
</div>

<!-- SENHA -->
<div id="passwordModal" class="modal hidden">
  <div class="card">
    <b>Digite a senha</b>
    <input type="password" id="passwordInput"/>
    <button onclick="checkPassword()">Entrar</button>
    <div id="passMsg"></div>
  </div>
</div>
  <!-- MODAL IMAGEM -->
<!-- MODAL IMAGEM GRANDE -->
<div id="imageModal" class="img-modal">
  <div class="img-wrap">
    <button class="img-close" type="button" onclick="closeImage()">✕</button>
    <img id="modalImage" class="img-full" alt="">
  </div>
</div>

<!-- PAINEL -->
<div id="panelModal" class="modal hidden">
  <div class="card">
    <b>Adicionar Local</b>

    <input type="hidden" id="editingId" value="">

    <input id="name" placeholder="Nome do local"/>
    <input id="desc" placeholder="Descrição"/>
    <input id="photo" placeholder="URL da foto"/>

    <select id="icon">
      <option value="red">🔴</option>
      <option value="blue">🔵</option>
      <option value="green">🟢</option>
      <option value="yellow">🟡</option>
      <option value="pink">🌸</option>
      <option value="black">⚫</option>
      <option value="white">⚪</option>
    </select>



    <div style="margin-top:8px;">
      <small>CDS:</small>
      <div id="coordsPreview"></div>
    </div>

    <div style="margin-top:10px;display:flex;gap:6px;">
      <button onclick="saveMarker()">Salvar</button>
      <button onclick="closePanel()" style="background:#444;">Cancelar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAiCGlKfd1Db9Td9wyMX6aSdMIv7gQrTmg",
  authDomain: "milocs-25357.firebaseapp.com",
  projectId: "milocs-25357",
  storageBucket: "milocs-25357.firebasestorage.app",
  messagingSenderId: "530932832038",
  appId: "1:530932832038:web:daaaf3ddd7995d401793e7",
  measurementId: "G-R59NDE15MK"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ADMIN_EMAIL = "luucas.amaral009@gmail.com";

let currentCoords = null;
let editingId = null;
let markers = [];
let leafletMarkers = new Map();
let isAdmin = false;
let pendingAction = null; // {type:'add'|'edit'|'delete', id}

/* ================= MAP ================= */
const map = L.map("map",{crs:L.CRS.Simple,minZoom:-2});
const bounds=[[0,0],[2048,2048]];
L.imageOverlay("map.png",bounds).addTo(map);
map.fitBounds(bounds);

document.getElementById("map").addEventListener("contextmenu",(e)=>e.preventDefault());

function getIcon(type){
  return L.icon({
    iconUrl: `icons/${type}.png`,
    iconSize:[32,32],
    iconAnchor:[16,32],
    popupAnchor:[0,-30]
  });
}

/* ================= AUTH ================= */
onAuthStateChanged(auth,(user)=>{
  isAdmin = !!user;
});

window.checkPassword = async function(){
  const pass = document.getElementById("passwordInput").value;
  try{
    await signInWithEmailAndPassword(auth, ADMIN_EMAIL, pass);
    document.getElementById("passwordModal").classList.add("hidden");
    document.getElementById("passMsg").innerText = "";

    if(pendingAction){
      const act = pendingAction;
      pendingAction = null;

      if(act.type === "add"){
        editingId = null;
        openEditPanel(null);
      } else if(act.type === "edit"){
        editingId = act.id;
        openEditPanel(act.id);
      } else if(act.type === "delete"){
        await deleteDoc(doc(db, "markers", act.id));
      }
    }
  }catch(e){
    document.getElementById("passMsg").innerText = "Senha incorreta.";
  }
};

/* ================= FIRESTORE REALTIME ================= */
onSnapshot(collection(db,"markers"),(snapshot)=>{
  markers = snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
  renderMarkers();
});

/* ================= RENDER ================= */
function clearMarkers(){
  leafletMarkers.forEach(m=>m.remove());
  leafletMarkers.clear();
}

function renderMarkers(){
  clearMarkers();

  markers.forEach(m=>{
    const marker=L.marker([m.x,m.y],{icon:getIcon(m.icon)}).addTo(map);

    marker.bindTooltip(m.name,{direction:"top",offset:[0,-10]});

    marker.bindPopup(`
      <div class="p-title">${m.name}</div>
      ${m.desc ? `<div class="p-desc">${m.desc}</div>`:""}
      ${m.photo ? `<img class="p-img" src="${m.photo}" onclick="openImage('${m.photo}')">` : ""}
    `);

    marker.on("contextmenu",(e)=>{
      e.originalEvent.preventDefault();
      showMarkerMenu(e.originalEvent.pageX,e.originalEvent.pageY,m.id);
    });

    leafletMarkers.set(m.id,marker);
  });

  renderSidebar();
}
window.openImage = function(src){
  const modal = document.getElementById("imageModal");
  const img = document.getElementById("modalImage");
  img.src = src;

  modal.classList.add("show");
};

window.closeImage = function(){
  const modal = document.getElementById("imageModal");
  modal.classList.remove("show");
};

// fechar clicando fora da imagem
document.getElementById("imageModal").addEventListener("click", (e) => {
  if (e.target.id === "imageModal") closeImage();
});
function renderSidebar(){
  const sidebar=document.getElementById("sidebarList");
  sidebar.innerHTML="";
  markers.forEach(m=>{
    const div=document.createElement("div");
    div.style.padding="8px";
    div.style.display="flex";
    div.style.gap="8px";
    div.style.cursor="pointer";

    div.innerHTML=`
      <img src="icons/${m.icon}.png" width="18">
      <span>${m.name}</span>
    `;

    div.onclick=()=>{
      map.setView([m.x,m.y],0);
      leafletMarkers.get(m.id)?.openPopup();
    };

    sidebar.appendChild(div);
  });
}

/* ================= MENU ================= */
map.on("contextmenu",(e)=>{
  currentCoords={x:Math.round(e.latlng.lat),y:Math.round(e.latlng.lng)};
  showMapMenu(e.originalEvent.pageX,e.originalEvent.pageY);
});

function showMapMenu(x,y){
  const menu=document.getElementById("contextMenu");
  menu.innerHTML="➕ Adicionar CDS";
  menu.style.left=x+"px";
  menu.style.top=y+"px";
  menu.classList.remove("hidden");

  menu.onclick=async ()=>{
    menu.classList.add("hidden");
    if(!isAdmin){
      pendingAction = { type: "add", id: null };
      document.getElementById("passwordModal").classList.remove("hidden");
      return;
    }
    editingId = null;
    openEditPanel(null);
  };
}

function showMarkerMenu(x,y,id){
  const menu=document.getElementById("contextMenu");
  menu.innerHTML=`
    <div id="editBtn">✏️ Editar</div>
    <div id="deleteBtn">🗑️ Deletar</div>
  `;
  menu.style.left=x+"px";
  menu.style.top=y+"px";
  menu.classList.remove("hidden");

  document.getElementById("editBtn").onclick=()=>{
    menu.classList.add("hidden");
    if(!isAdmin){
      pendingAction = { type: "edit", id };
      document.getElementById("passwordModal").classList.remove("hidden");
      return;
    }
    editingId = id;
    openEditPanel(id);
  };

  document.getElementById("deleteBtn").onclick=async ()=>{
    menu.classList.add("hidden");
    if(!isAdmin){
      pendingAction = { type: "delete", id };
      document.getElementById("passwordModal").classList.remove("hidden");
      return;
    }
    await deleteDoc(doc(db,"markers",id));
  };
}

document.addEventListener("click",()=>{
  document.getElementById("contextMenu").classList.add("hidden");
});

/* ================= PANEL ================= */
function openEditPanel(id=null){
  document.getElementById("panelModal").classList.remove("hidden");
  const hidden = document.getElementById("editingId");

  if(id){
    hidden.value = id;
    // ✅ garante que salvar vai fazer update
    editingId = id;

    const m = markers.find(x => x.id === id);
    if(!m) return;

    document.getElementById("name").value  = m.name  || "";
    document.getElementById("desc").value  = m.desc  || "";
    document.getElementById("photo").value = m.photo || "";
    document.getElementById("icon").value  = m.icon  || "red";

    currentCoords = { x: m.x, y: m.y };
  } else {
    hidden.value = "";
    // ✅ modo novo
    editingId = null;
    document.getElementById("name").value  = "";
    document.getElementById("desc").value  = "";
    document.getElementById("photo").value = "";
    // currentCoords já vem do clique no mapa
  }

  document.getElementById("coordsPreview").innerText =
    `X: ${currentCoords.x} | Y: ${currentCoords.y}`;
}

window.closePanel=function(){
  const hid = document.getElementById("editingId");
  if(hid) hid.value = "";
  document.getElementById("panelModal").classList.add("hidden");
};

window.saveMarker = async function(){
  if(!isAdmin) return alert("Login admin necessário");

  const id = (document.getElementById("editingId")?.value || "").trim() || null;

  const data = {
    name: document.getElementById("name").value.trim(),
    desc: document.getElementById("desc").value.trim(),
    photo: document.getElementById("photo").value.trim(),
    icon: document.getElementById("icon").value,
    x: currentCoords.x,
    y: currentCoords.y
  };

  if(id){
    await updateDoc(doc(db, "markers", id), data);
  } else {
    await addDoc(collection(db, "markers"), data);
  }

  document.getElementById("editingId").value = "";
  document.getElementById("panelModal").classList.add("hidden");
  editingId = null;
};
</script>

</body>
</html>
